# @package _global_

# to execute this experiment run:
# python train.py experiment=example

defaults:
  - override /callbacks: default
  - override /data: new_pdb
  - override /model: denoise_fixed
  - override /trainer: ddp

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

callbacks:
  model_checkpoint:
    save_top_k: -1
    every_n_epochs: 2
    save_last: true
    monitor: "val/loss"
    mode: "min"
  early_stopping:
    monitor: "val/loss"
    mode: "min"

data:
  batch_size: 24
  dataset:
    transform:
      pretrain: true

model:
  optimizer:
    lr: 1e-4
  net:
    token_dim: 192          # reduced from 384
    token_pair_dim: 16      # reduced from 32
    atom_dim: 64            # reduced from 128
    atom_pair_dim: 8        # reduced from 16
    N_block_atom: 2         # reduced from 3
    N_head_atom: 2          # reduced from 4 (maintains 32 head dim)
    N_block_token: 2        # reduced from 3
    N_head_token: 4         # reduced from 8 (maintains 48 head dim)
    N_query: 16             # reduced from 32
    N_key: 64               # reduced from 128
    dropout: 0.0
  loss_type: gaussian
  noise_model:
    P_mean: 0.05
  output_param: v

trainer:
  min_epochs: 15  # Reduced from 33 (article: 180k steps)
  max_epochs: 15
  devices: 4
  # gradient_clip_val: 0.5

tags: ["dev"]

task_name: "denoising_XS_scale0_5"   # updated task name

seed: 42

ckpt_path: null
